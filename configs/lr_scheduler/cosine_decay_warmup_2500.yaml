# Same warmup length as `constant_warmup` (2500 steps), then cosine decay to `lr_min`.
# Use for long runs where you want an early LR curve similar to the constant baseline,
# but LR decay in late training (e.g. to reduce loss spikes past ~800k steps).
_target_: utils.CosineDecayWarmupLRScheduler
t_in_epochs: False
t_initial: ${eval:${trainer.max_steps}-${.warmup_t}}
warmup_prefix: True
warmup_lr_init: 1e-6
warmup_t: 2500
lr_min: 1e-6
